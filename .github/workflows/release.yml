name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release version
        shell: bash
        run: |
          npm run check
          version="$(node -p "require('./module.json').version")"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match module version v${version}."
            exit 1
          fi

      - name: Build Foundry package
        shell: bash
        run: |
          version="$(node -p "require('./module.json').version")"
          mkdir -p dist
          cp module.json dist/module.json
          zip -r "dist/hm3-improved-autocombat-v${version}.zip" \
            module.json scripts styles lang LICENSE README.md CHANGELOG.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/module.json \
            dist/hm3-improved-autocombat-*.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

